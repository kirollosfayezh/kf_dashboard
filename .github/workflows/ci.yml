name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build refuses to run without an API origin (see vite.config.ts).
          # This is a public URL, not a secret; nothing is deployed from CI.
          VITE_API_BASE_URL: https://kf-backend-tv5l.onrender.com

      # The router plugin regenerates src/routeTree.gen.ts during the build.
      # Fail if the committed copy has drifted from the routes on disk.
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
